<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#9A2B2E">
    <title>PDCA & SLA • Hospital Pio XII</title>
    <style>
        :root { --bordo: #9A2B2E; --bordo-escuro: #6E1B1E; --bg-page: #F1F5F9; --card-bg: #FFFFFF; --border: #E2E8F0; --text-main: #0F172A; --text-sec: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-page); color: var(--text-main); padding-bottom: 40px; }
        .header { background: linear-gradient(135deg, var(--bordo) 0%, var(--bordo-escuro) 100%); color: #FFFFFF; padding: 16px; }
        .header-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .container { max-width: 760px; margin: 0 auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .card-title { font-size: 0.92rem; font-weight: 800; color: var(--bordo); text-transform: uppercase; }
        p { font-size: 0.85rem; color: var(--text-sec); line-height: 1.4; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div><h1>PDCA & SLA</h1><a href="portal.html" style="color:#FFF; font-size:0.75rem; text-decoration:underline;">⬅ Voltar ao Portal</a></div>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <div class="card-title">Gestão de Planos de Ação 5W2H</div>
            <p>Módulo dedicado ao acompanhamento de prazos de correção para as não conformidades detectadas nas auditorias de higienização hospitalar, garantindo conformidade com os padrões ONA.</p>
            <p style="margin-top:10px; font-weight:700; color:var(--bordo);">Status: Ativo e integrado ao ecossistema PWA.</p>
        </section>
    </main>
</body>
</html>
