<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#9A2B2E">
    <title>Dashboard • Hospital Pio XII</title>
    <style>
        :root { --bordo: #9A2B2E; --bordo-escuro: #6E1B1E; --bg-page: #F1F5F9; --card-bg: #FFFFFF; --border: #E2E8F0; --text-main: #0F172A; --text-sec: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-page); color: var(--text-main); padding-bottom: 40px; }
        .header { background: linear-gradient(135deg, var(--bordo) 0%, var(--bordo-escuro) 100%); color: #FFFFFF; padding: 16px; }
        .header-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .container { max-width: 760px; margin: 0 auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .card-title { font-size: 0.92rem; font-weight: 800; color: var(--bordo); text-transform: uppercase; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media(min-width:560px) { .metrics-grid { grid-template-columns: repeat(4, 1fr); } }
        .metric-box { background: #F8FAFC; border: 1px solid var(--border); border-radius: 11px; padding: 12px; text-align: center; }
        .metric-val { font-size: 1.25rem; font-weight: 900; color: var(--bordo); }
        .metric-lbl { font-size: 0.7rem; font-weight: 700; color: var(--text-sec); text-transform: uppercase; margin-top: 2px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
        th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
        th { font-weight: 800; color: var(--text-sec); background: #F8FAFC; }
        .btn-acao { background: var(--bordo); color: #FFFFFF; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; text-decoration: none; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div><h1>Dashboard ONA</h1><a href="portal.html" style="color:#FFF; font-size:0.75rem; text-decoration:underline;">⬅ Voltar ao Portal</a></div>
            <a href="index.html" class="btn-acao">+ Nova Auditoria</a>
        </div>
    </header>
    <main class="container">
        <div class="metrics-grid">
            <div class="metric-box"><div class="metric-val" id="totalAuditorias">0</div><div class="metric-lbl">Auditorias</div></div>
            <div class="metric-box"><div class="metric-val" id="taxaConformidade">100%</div><div class="metric-lbl">Conformidade</div></div>
            <div class="metric-box"><div class="metric-val" id="totalFalhas" style="color:#B91C1C;">0</div><div class="metric-lbl">Não Conformes</div></div>
            <div class="metric-box"><div class="metric-val" id="metasAtendidas">OK</div><div class="metric-lbl">Meta ONA</div></div>
        </div>
        <section class="card">
            <div class="card-title">Histórico de Auditorias Recentes</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Data/Hora</th><th>Auditora</th><th>Setor</th><th>Leito</th><th>Nota</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="tabelaHistorico">
                        <tr><td colspan="7" style="text-align:center; color:#64748B; padding:20px;">Nenhuma auditoria registrada ainda.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        function carregarDashboard() {
            const historico = JSON.parse(localStorage.getItem('pio12_historico') || '[]');
            document.getElementById('totalAuditorias').textContent = historico.length;
            if (historico.length === 0) return;
            let totalItensGeral = 0; let totalNaoConformesGeral = 0;
            historico.forEach(h => {
                totalItensGeral += h.totalItens;
                totalNaoConformesGeral += h.naoConformes;
            });
            const conformesGeral = totalItensGeral - totalNaoConformesGeral;
            const taxa = totalItensGeral > 0 ? Math.round((conformesGeral / totalItensGeral) * 100) : 100;
            document.getElementById('taxaConformidade').textContent = taxa + '%';
            document.getElementById('totalFalhas').textContent = totalNaoConformesGeral;

            const tbody = document.getElementById('tabelaHistorico');
            tbody.innerHTML = historico.map(h => {
                const nota = h.totalItens > 0 ? Math.round(((h.totalItens - h.naoConformes) / h.totalItens) * 100) : 100;
                return `
                    <tr>
                        <td style="font-weight:700;">${h.id}</td>
                        <td>${h.dataHora}</td>
                        <td>${h.auditora}</td>
                        <td>${h.setor}</td>
                        <td>${h.leito}</td>
                        <td style="font-weight:800; color:${nota < 90 ? '#B91C1C' : '#15803D'};">${nota}%</td>
                        <td><button class="btn-acao" onclick="abrirDetalhes('${h.id}')">Ver</button></td>
                    </tr>
                `;
            }).join('');
        }
        function abrirDetalhes(id) {
            const historico = JSON.parse(localStorage.getItem('pio12_historico') || '[]');
            const item = historico.find(h => h.id === id);
            if (item) {
                alert(`Auditoria: ${item.id}\nSetor: ${item.setor} - Leito ${item.leito}\nAuditora: ${item.auditora}\nFalhas:\n${item.falhasStr}`);
            }
        }
        window.addEventListener('DOMContentLoaded', carregarDashboard);
    </script>
</body>
</html>
